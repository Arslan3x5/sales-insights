<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sales Insights{% endblock %}</title>
<style>
:root{--bg:#f5f6fb;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6e9f2;--accent:#4f46e5;--accent2:#06b6d4;--bad:#e11d48;--ok:#059669;--shadow:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f1f;--surface:#121936;--ink:#e8ecf8;--muted:#8d99b8;--line:#232d52;--accent:#8b8ff8;--accent2:#22d3ee;--bad:#fb7185;--ok:#34d399;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 420px at 90% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(700px 380px at -5% 0,color-mix(in srgb,var(--accent2) 12%,transparent),transparent),var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:.75rem clamp(1rem,4vw,2.5rem);background:color-mix(in srgb,var(--surface) 75%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--ink);font-size:1.1rem}
.logo i{width:1.7rem;height:1.7rem;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:.9rem}
main{max-width:1100px;margin:auto;padding:2rem clamp(1rem,4vw,2.5rem) 4rem}
h1{margin:0;font-size:clamp(1.7rem,3.4vw,2.4rem);letter-spacing:-.04em;line-height:1.15}
h2{margin:0 0 .2rem;font-size:1.05rem;letter-spacing:-.01em}
.sub{margin:.3rem 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.3rem;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:0;border-radius:12px;padding:.7rem 1.2rem;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--accent2)));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.pill{display:inline-block;padding:.15rem .7rem;border-radius:99px;font-size:.8rem;font-weight:600;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.muted{color:var(--muted)}
.stack{display:grid;gap:1.2rem}
.table-wrap{overflow-x:auto;margin-top:.6rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.errorlist{color:var(--bad);margin:.7rem 0 0;padding-left:1.1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav class="top"><a class="logo" href="{% url 'upload' %}"><i>◢</i>Sales Insights</a><a class="btn ghost" href="{% url 'upload' %}">New upload</a></nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
