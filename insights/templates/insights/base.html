<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sales Insights{% endblock %}</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#16202a;--muted:#5f6b78;--line:#dde2e8;--accent:#2a5bd7;--accent-ink:#fff;--bad:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--surface:#171e26;--ink:#e7edf3;--muted:#8d9aa8;--line:#27313c;--accent:#6c97ff;--accent-ink:#0a1020;--bad:#f08a5d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{padding:1rem clamp(1rem,4vw,2.5rem);border-bottom:1px solid var(--line);background:var(--surface)}
header a{font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--ink);letter-spacing:-.02em}
main{max-width:980px;margin:auto;padding:2rem clamp(1rem,4vw,2.5rem)}
h1{margin:0 0 .3rem;font-size:clamp(1.6rem,3vw,2.1rem);letter-spacing:-.03em}
.sub{margin:0 0 1.5rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:.65rem 1.2rem;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
input[type=file]{width:100%;padding:1.4rem;border:2px dashed var(--line);border-radius:12px;background:var(--bg);color:inherit;font:inherit}
.errorlist{color:var(--bad);margin:.6rem 0 0;padding-left:1.1rem}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600}
.chips{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.2rem}
.chip strong{display:block;font-size:1.7rem;line-height:1.1}
.chip span{color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)}
.stack{display:grid;gap:1.2rem}
</style>
</head>
<body>
<header><a href="{% url 'upload' %}">Sales Insights</a></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
